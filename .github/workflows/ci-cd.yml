name: Laravel CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging..."

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production deployment
        run: |
          echo "1. php artisan down --retry=60"
          echo "2. git pull origin main"
          echo "3. composer install --no-dev --optimize-autoloader"
          echo "4. php artisan migrate --force"
          echo "5. php artisan config:cache"
          echo "   php artisan route:cache"
          echo "   php artisan view:cache"
          echo "6. php artisan queue:restart"
          echo "7. php artisan up"