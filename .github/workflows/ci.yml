name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - main
      - dev

jobs:
  uji:
    name: Uji
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Jalankan test
        working-directory: frontend
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validasi HTML
        run: npx --yes html-validate index.html